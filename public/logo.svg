<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- BIMA DuctDesigner — duct elbow mark -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#082f3a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- glow halo -->
  <path d="M 96 336 H 344 V 96" fill="none" stroke="#22d3ee" stroke-opacity="0.45"
        stroke-width="130" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>

  <!-- pipe: dark wall + cyan bore -->
  <path d="M 96 336 H 344 V 96" fill="none" stroke="#0f202c" stroke-width="100"
        stroke-linejoin="round" stroke-linecap="butt"/>
  <path d="M 96 336 H 344 V 96" fill="none" stroke="#22d3ee" stroke-width="62"
        stroke-linejoin="round" stroke-linecap="butt"/>

  <!-- airflow chevrons -->
  <g stroke="#f0f6fc" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 172 310 L 196 336 L 172 362"/>
    <path d="M 226 310 L 250 336 L 226 362"/>
  </g>

  <!-- flange caps -->
  <g fill="#d2f5fc">
    <rect x="72" y="284" width="26" height="104" rx="13"/>
    <rect x="292" y="72" width="104" height="26" rx="13"/>
  </g>
  <!-- corner ring flange -->
  <rect x="382" y="374" width="94" height="94" rx="14" fill="#a5f3fc" fill-opacity="0.85"/>
</svg>
